name: Release

# Builds every publishable artifact this project ships — the packages/vscode
# extension's .vsix AND the three npm packages (packages/content,
# packages/mcp-server, packages/cli) — and attaches all of them to ONE
# GitHub Release for a given version. One tag, one release, every artifact:
# the extension and the npm packages can never end up shipped at silently
# different versions from two independent pipelines.
#
# Does NOT publish anything to a real registry (npm or the VS Code
# Marketplace) — that's a separate, manually-confirmed step per destination
# (see publish-marketplace.yml and publish-npm.yml), so a bad build never
# reaches real users just because a tag got pushed. Both publish workflows
# download their artifact from the release this workflow creates rather
# than rebuilding, so what gets published is provably the exact thing that
# passed this workflow's checks.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix, e.g., 0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without creating a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  EXTENSION_NAME: open-design-agent-kit

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi

          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "✅ Version: $VERSION (prerelease: $IS_PRERELEASE)"

      - name: Validate version matches packages/vscode/package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_VERSION=$(node -p "require('./packages/vscode/package.json').version")

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch: tag/input=$VERSION, packages/vscode/package.json=$PACKAGE_VERSION"
            echo "Bump packages/vscode/package.json's version and commit before tagging."
            exit 1
          fi
          echo "✅ Version match confirmed: $VERSION"

      - name: Validate npm package versions match the release
        # One shared release for every artifact means one version for every
        # artifact — a tag doesn't just gate the .vsix, it gates the three
        # npm packages too, so they can never drift to a different released
        # version than the extension without this failing loudly first.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for PKG in packages/content packages/mcp-server packages/cli; do
            PACKAGE_VERSION=$(node -p "require('./$PKG/package.json').version")
            if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
              echo "❌ Version mismatch: tag/input=$VERSION, $PKG/package.json=$PACKAGE_VERSION"
              echo "Bump $PKG's version and commit before tagging."
              exit 1
            fi
            echo "✅ Version match confirmed for $PKG: $VERSION"
          done

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Same gates every round of local work already runs before packaging;
      # a tag alone shouldn't be enough to ship a broken build.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes vendored-content drift check)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # --- npm packages (packages/content, packages/mcp-server, packages/cli) ---
      # See openspec/changes/npm-publish-automation/design.md for why this
      # lives in the same job as the VSIX build rather than a separate
      # workflow, and why the pin/smoke-test/pack order below matters.

      - name: Pin cross-package npm dependency versions for release
        # Rewrites packages/mcp-server/package.json's (and packages/cli's) dependency on
        # @feimacode/open-design-agent-kit-content from "*" (correct for
        # local development, where npm workspaces always resolves it to the
        # sibling package via a symlink regardless of version) to a real
        # pinned range matching the content version in THIS release. Only
        # touches this ephemeral checkout — never committed back.
        run: node scripts/pin-content-version-for-publish.mjs

      - name: Build npm packages
        run: |
          npm run compile --workspace=@feimacode/open-design-agent-kit-mcp
          npm run compile --workspace=@feimacode/open-design-agent-kit

      - name: Verify npm publish end-to-end (local registry)
        # Real npm publish to a throwaway local registry, then a real `npx`
        # resolution and MCP JSON-RPC handshake from a directory with zero
        # access to this checkout's own node_modules. This is the one check
        # that would have caught "packages/content is private, so
        # packages/mcp-server can never actually resolve it once published"
        # — npm pack --dry-run alone does not exercise cross-package
        # dependency resolution at all.
        run: node scripts/test-npm-publish.mjs

      - name: Pack npm packages
        run: |
          mkdir -p release
          npm pack --workspace=packages/content --pack-destination release
          npm pack --workspace=packages/mcp-server --pack-destination release
          npm pack --workspace=packages/cli --pack-destination release

      - name: Generate SHA-256 checksums for npm packages
        working-directory: release
        run: |
          for f in *.tgz; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Package VSIX
        working-directory: packages/vscode
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p ../../release
          # vsce runs this package's own "vscode:prepublish" script first
          # (the esbuild production bundle), then zips packages/vscode per
          # .vscodeignore.
          #
          # --no-dependencies is required here, not optional: packages/vscode
          # has no node_modules of its own (npm workspaces hoists everything
          # to the repo root), so without this flag vsce's production-
          # dependency walk resolves @feimacode/open-design-agent-kit-core up
          # through the root node_modules/@feimacode/ symlink directory and
          # sweeps in every OTHER sibling workspace package it finds sitting
          # there too (packages/core, content, cli, codex, mcp-server,
          # claude-plugin) — confirmed by an actual `vsce package` dry run,
          # which produced a 16MB+ VSIX full of unrelated monorepo content.
          # Safe to skip entirely because esbuild already bundles every
          # runtime dependency (gray-matter, the core package) straight into
          # dist/extension.js with only `vscode` left external — nothing this
          # extension needs at runtime lives in node_modules.
          npx --yes @vscode/vsce package --no-dependencies --out "../../release/${EXTENSION_NAME}-${VERSION}.vsix"

      - name: Generate SHA-256 checksum
        working-directory: release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VSIX="${EXTENSION_NAME}-${VERSION}.vsix"
          sha256sum "$VSIX" > "${VSIX}.sha256"
          echo "Checksum: $(cat "${VSIX}.sha256")"

      - name: Validate VSIX structure
        working-directory: release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VSIX="${EXTENSION_NAME}-${VERSION}.vsix"
          unzip -l "$VSIX" | grep -E "extension.vsixmanifest|extension/package.json" || {
            echo "❌ VSIX is missing required files"
            exit 1
          }
          echo "✅ VSIX structure validated"
          ls -lh "$VSIX"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            release/*.vsix
            release/*.tgz
            release/*.sha256

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d')
          fi
          if [ -z "${CHANGELOG:-}" ]; then
            CHANGELOG="_No curated changelog entry for ${VERSION} — see commits below._"
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            release/*.vsix
            release/*.tgz
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          {
            echo "## Release Summary"
            echo ""
            echo "**Version**: v$VERSION"
            echo "**Pre-release**: ${{ needs.validate.outputs.is_prerelease }}"
            echo ""
            echo "### Artifacts"
            echo "- \`${EXTENSION_NAME}-${VERSION}.vsix\`"
            echo "- \`feimacode-open-design-agent-kit-content-${VERSION}.tgz\`"
            echo "- \`feimacode-open-design-agent-kit-mcp-${VERSION}.tgz\`"
            echo "- \`feimacode-open-design-agent-kit-${VERSION}.tgz\`"
            echo ""
            echo "Next step: run the **Publish to Marketplace** and/or **Publish npm Packages** workflows with version \`$VERSION\` to actually publish them."
          } >> "$GITHUB_STEP_SUMMARY"
