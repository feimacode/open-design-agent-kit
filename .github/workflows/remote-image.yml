# Builds and smoke-tests the hosted MCP server image (openspec add-remote-mcp-server,
# phase 1). Manual only, and it pushes nowhere: the registry and host are
# chosen later (deploy/README.md).
name: Hosted server image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t open-design-remote:ci .

      - name: Run and smoke-test it
        run: |
          TOKEN="ci-$(openssl rand -hex 16)"
          docker run -d --name od -p 8080:8080 -e OPEN_DESIGN_REMOTE_TOKEN="$TOKEN" open-design-remote:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          deploy/smoke-test.sh http://127.0.0.1:8080 "$TOKEN"
          docker exec od /usr/local/bin/chromium-no-sandbox --headless --dump-dom about:blank > /dev/null

      - name: Server log
        if: always()
        run: docker logs od || true
