<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600">
<title>Open Design Agent Kit — X/Twitter Share Card</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    position: relative;
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 72px 96px;
  }

  /* Subtle grid pattern overlay */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(16,163,127,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(16,163,127,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  /* Glow accent */
  .card::after {
    content: '';
    position: absolute;
    top: -200px;
    right: -100px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(16,163,127,0.12) 0%, transparent 65%);
    pointer-events: none;
  }

  .card > * { position: relative; z-index: 1; }

  /* — Eyebrow — */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(16,163,127,0.12);
    border: 1px solid rgba(16,163,127,0.25);
    border-radius: 9999px;
    padding: 6px 16px 6px 12px;
    width: fit-content;
    margin-bottom: 32px;
  }
  .eyebrow-dot {
    width: 8px; height: 8px;
    background: #10a37f;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .eyebrow span {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #10a37f;
    text-transform: uppercase;
  }

  /* — Title — */
  .title {
    font-size: 72px;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-bottom: 28px;
    max-width: 1100px;
  }
  .title .accent {
    background: linear-gradient(135deg, #10a37f 0%, #2dd4bf 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* — Tagline — */
  .tagline {
    font-size: 28px;
    font-weight: 400;
    line-height: 1.4;
    color: #e5e5e5;
    max-width: 900px;
    margin-bottom: 20px;
  }

  .subtitle {
    font-size: 18px;
    font-weight: 400;
    line-height: 1.6;
    color: #6e6e6e;
    max-width: 820px;
    margin-bottom: 48px;
  }

  /* — Stats — */
  .stats {
    display: flex;
    gap: 48px;
    margin-bottom: 40px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 600;
    color: #10a37f;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 13px;
    font-weight: 500;
    color: #6e6e6e;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* — Footer — */
  .footer {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .repo-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 10px 20px;
  }
  .repo-badge span {
    font-size: 15px;
    font-weight: 400;
    color: #9b9b9b;
    font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  .repo-badge .highlight {
    color: #10a37f;
  }
  .platform-icons {
    display: flex;
    gap: 12px;
    margin-left: auto;
  }
  .platform-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .platform-icon svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="card" data-od-card>

  <!-- Eyebrow -->
  <div class="eyebrow">
    <div class="eyebrow-dot"></div>
    <span>Open Source &bull; MIT Licensed</span>
  </div>

  <!-- Title -->
  <div class="title">
    <span class="accent">Open Design</span> Agent Kit
  </div>

  <!-- Tagline -->
  <div class="tagline">
    Pro-grade design, built right into the coding agent you already use.
  </div>

  <div class="subtitle">
    No desktop app. No daemon. No extra account. Just ask, and the files show up in your repo.
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-value">280+</div>
      <div class="stat-label">Skills</div>
    </div>
    <div class="stat">
      <div class="stat-value">152</div>
      <div class="stat-label">Design Systems</div>
    </div>
    <div class="stat">
      <div class="stat-value">167</div>
      <div class="stat-label">Remixable Examples</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="repo-badge">
      <!-- GitHub icon SVG -->
      <svg viewBox="0 0 16 16" fill="#9b9b9b"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span><span class="highlight">feimacode</span>/open-design-agent-kit</span>
    </div>

    <!-- Agent platform icons -->
    <div class="platform-icons">
      <!-- Copilot icon -->
      <div class="platform-icon" title="GitHub Copilot">
        <svg viewBox="0 0 24 24" fill="#10a37f"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0012 2z"/></svg>
      </div>
      <!-- Claude icon -->
      <div class="platform-icon" title="Claude Code">
        <svg viewBox="0 0 24 24" fill="#10a37f"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#10a37f" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="#10a37f"/></svg>
      </div>
      <!-- Codex icon -->
      <div class="platform-icon" title="Codex">
        <svg viewBox="0 0 24 24" fill="#10a37f"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
      </div>
      <!-- Cursor icon -->
      <div class="platform-icon" title="Cursor">
        <svg viewBox="0 0 24 24" fill="#10a37f"><path d="M5 3l14 8-6.5 2L12 20 5 3z"/></svg>
      </div>
    </div>
  </div>

</div>
</body>
</html>
