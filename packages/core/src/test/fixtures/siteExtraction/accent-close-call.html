<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two tone</title>
<!-- Two colourful buttons of the same size: a close call. -->
<style>
  body { margin: 0; background: #ffffff; color: #222; font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 32px; }
  .a, .b { color: #fff; padding: 12px 24px; border: 0; border-radius: 6px; font-size: 16px; }
  .a { background: #2563eb; }
  .b { background: #ea580c; }
</style>
</head>
<body>
<main>
  <h1>Pick a plan</h1>
  <p>Both plans include unlimited projects, email support and a thirty day trial with no card needed up front.</p>
  <button class="a">Monthly plan</button> <button class="b">Yearly plan</button>
</main>
</body>
</html>
