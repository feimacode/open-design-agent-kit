<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deepwater</title>
<!-- A large #002533 button and a smaller sky-blue one; the declared --primary-color is the blue. -->
<style>
  :root { --primary-color: #0ea5e9; }
  body { margin: 0; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 32px; }
  .dark { background: #002533; color: #fff; padding: 20px 56px; border: 0; border-radius: 4px; font-size: 18px; }
  .sky { background: var(--primary-color); color: #fff; padding: 8px 16px; border: 0; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Ocean data for shipping teams</h1>
  <p>Live currents, swell and wind along your routes, refreshed every ten minutes and delivered to the bridge.</p>
  <button class="dark">Get the app</button>
  <p>Already a customer? Your routes sync when you sign in.</p>
  <button class="sky">Sign in</button>
</main>
</body>
</html>
