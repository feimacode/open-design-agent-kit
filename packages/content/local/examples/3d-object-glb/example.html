const token = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
const palette = { bg: new THREE.Color(token('--bg', '#e8ece8')), accent: new THREE.Color(token('--accent', '#2f5d50')) };
if (TRANSPARENT) document.documentElement.classList.add('od-transparent');

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: TRANSPARENT, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = TRANSPARENT ? null : palette.bg;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(-3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.radius = 6;
scene.add(key);

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
const product = new THREE.Group();
scene.add(product);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

let distance = 5;
function resize() {
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.copy(controls.target).add(new THREE.Vector3(0, 0.32, 1).normalize().multiplyScalar(camera.aspect < 1 ? distance / camera.aspect ** 0.6 : distance));
  camera.updateProjectionMatrix();
  camera.lookAt(controls.target);
}
window.addEventListener('resize', resize);

/** Centers any model on the ground and frames it, whatever its units or origin. */
function stage(model) {
  model.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
  product.add(model);
  const radius = size.length() / 2;
  distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.15;
  controls.target.set(0, size.y * 0.48, 0);
  controls.minDistance = distance * 0.5;
  controls.maxDistance = distance * 3;
  ground.scale.setScalar(radius * 8);
  key.shadow.camera.left = key.shadow.camera.bottom = -radius * 2;
  key.shadow.camera.right = key.shadow.camera.top = radius * 2;
  key.shadow.camera.far = radius * 20;
  key.position.set(-radius * 3, radius * 6, radius * 4);
  camera.near = distance / 100;
  camera.far = distance * 10;
  resize();
}

const start = performance.now();
window.odScene = { rotate: true, rotationSeconds: ROTATION_SECONDS, ready: undefined };
function pose(now) {
  const turn = window.odScene.rotate ? (((now - start) / 1000) / ROTATION_SECONDS) * Math.PI * 2 : 0;
  product.rotation.y = AUTHORED_ANGLE + turn;
}
window.odScene.ready = (async () => {
  const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
  const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync(MODEL_URL);
  stage(gltf.scene);
  pose(performance.now());
  renderer.render(scene, camera);
})();
renderer.setAnimationLoop((now) => {
  pose(now);
  controls.update();
  renderer.render(scene, camera);
});
