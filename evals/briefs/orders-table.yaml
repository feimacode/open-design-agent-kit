id: orders-table
request: "Design the orders list for our UK online shop's admin: every order with customer, date, items, total and status"
expect:
  surface: app-screens
  skills: [app-table]
  questions: { max: 1 }
designSystem: null
answers:
  platform: "Web app"
  density: "Compact"
  locale: "UK shop, prices in GBP"
must:
  - "Rows come from a data file (data-od-repeat), at least 12 orders"
  - "One very long customer name, a £0.00 order and a very large total, shown without breaking the row"
  - "Dates and money formatted for en-GB (4 Mar 2026, £1,240.00)"
